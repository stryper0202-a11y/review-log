<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>구매 제품 기록장 — 기기 간 동기화</title>
<style>
  :root{--blue:#2563eb;--muted:#6b7280;--gap:12px;--radius:10px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",Arial;}
  *{box-sizing:border-box}
  body{margin:0;background:#f3f5fb;padding:20px;color:#111;}
  .wrap{max-width:1100px;margin:0 auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 30px rgba(8,15,40,0.06);} 
  header{display:flex;align-items:center;gap:12px;margin-bottom:12px;} h1{font-size:18px;margin:0}
  .toolbar{margin-left:auto;display:flex;gap:8px;align-items:center;} button{background:var(--blue);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer} button.ghost{background:#f3f4f6;color:#111;border:1px solid #e6e9f0} button.small{padding:6px 8px;font-size:13px}
  .form-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;}
  .form-main{display:grid;gap:12px;grid-template-columns:repeat(12,1fr);align-items:start;}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#111;} input[type="text"],input[type="date"],input[type="number"],select,textarea{padding:10px;border-radius:8px;border:1px solid #e6e9f0;font-size:14px;background:#fff;min-height:40px;} textarea{min-height:120px;resize:vertical} .inline{display:flex;gap:8px;align-items:center} .muted{color:var(--muted);font-size:13px}
  .c-12{grid-column:1 / -1} .cat-major{grid-column:1 / span 4} .cat-middle{grid-column:5 / span 4} .cat-minor{grid-column:9 / span 4}
  .cat-block{display:flex;flex-direction:column;gap:8px} .add-btn{display:inline-block;padding:10px;border-radius:8px;border:1px dashed #e6eefc;background:#f8fbff;color:#123;text-align:center;cursor:pointer} .add-btn:hover{background:#eef6ff;border-color:#dbeeff}
  .align-row{grid-column:1 / -1;display:grid;grid-template-columns:1fr 360px;gap:12px;align-items:center} .left-group{display:flex;flex-direction:column;gap:12px} .right-group{display:flex;flex-direction:column;gap:12px;align-items:stretch} .right-inner{display:flex;flex-direction:column;gap:12px;justify-content:center;height:100%}
  .side-panel{border-left:1px dashed #eef2ff;padding-left:16px} .panel-block{background:#fbfdff;border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid #eef4ff}
  table{width:100%;border-collapse:collapse;margin-top:10px} th,td{padding:10px;border-bottom:1px solid #f1f3f8;text-align:left;font-size:13px;vertical-align:middle} th{background:#fbfcff;cursor:pointer} img.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #eee}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:none;align-items:center;justify-content:center;z-index:2000} .modal{background:#fff;border-radius:12px;padding:16px;max-width:920px;width:94%;max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(2,6,23,0.4)}
  .mgr-list{margin-top:12px;border:1px solid #eef4ff;padding:12px;border-radius:10px;max-height:56vh;overflow:auto} .maj,.mid,.min{display:flex;gap:8px;align-items:center;margin-bottom:6px} .maj strong{min-width:160px}.mid span{min-width:140px}.min span{min-width:120px} .tiny{padding:6px 8px;border-radius:8px;border:0;cursor:pointer} .danger{background:#fff5f5;color:#b91c1c;border:1px solid #fecaca}
  .filters{display:flex;gap:10px;align-items:center;padding:10px;background:#fbfdff;border-radius:10px;border:1px solid #eef4ff;margin-top:10px}
  .sync-status{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:12px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .sync-status.syncing{background:#fef3c7;color:#92400e;border-color:#fde68a}
  .sync-status.error{background:#fef2f2;color:#991b1b;border-color:#fecaca}
  .sync-indicator{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  @media(max-width:1000px){.form-grid{grid-template-columns:1fr}.side-panel{border-left:none;padding-left:0}.form-main{grid-template-columns:repeat(6,1fr)}.cat-major{grid-column:1 / span 6}.cat-middle{grid-column:1 / span 6}.cat-minor{grid-column:1 / span 6}.align-row{grid-template-columns:1fr}.right-inner{justify-content:flex-start}.add-btn{width:100%}.filters{flex-direction:column;align-items:stretch}.filters select{min-width:unset;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>구매 제품 기록장</h1>
    <div class="toolbar">
      <span id="syncStatus" class="sync-status" style="display:none">
        <span class="sync-indicator"></span>
        <span id="syncStatusText">동기화 완료</span>
      </span>
      <button id="openCategoryMgr" class="ghost small">분류 관리</button>
      <button id="exportCSV" class="ghost small">CSV</button>
      <button id="exportJSON" class="ghost small">JSON</button>
      <button id="btnImport" class="ghost small">불러오기</button>
      <button id="clearAll" class="ghost small">모두 삭제</button>
    </div>
  </header>

  <div class="form-grid">
    <div>
      <form id="productForm" onsubmit="return false;">
        <div class="form-main">
          <div class="c-12">
            <label class="field">제품명
              <input id="name" type="text" placeholder="예: ABC 세럼" required />
            </label>
          </div>

          <div class="cat-major">
            <div class="cat-block">
              <label class="field">대분류
                <select id="majorSelect" aria-label="대분류 선택"></select>
              </label>
              <button id="addMajor" class="add-btn" aria-label="대분류 추가" title="새 대분류 추가">+ 대분류 추가</button>
            </div>
          </div>

          <div class="cat-middle">
            <div class="cat-block">
              <label class="field">중분류
                <select id="middleSelect" aria-label="중분류 선택"></select>
              </label>
              <button id="addMiddle" class="add-btn" aria-label="중분류 추가" title="선택된 대분류 아래에 새 중분류 추가">+ 중분류 추가</button>
            </div>
          </div>

          <div class="cat-minor">
            <div class="cat-block">
              <label class="field">소분류
                <select id="minorSelect" aria-label="소분류 선택"></select>
              </label>
              <button id="addMinor" class="add-btn" aria-label="소분류 추가" title="선택된 대분류·중분류 아래에 새 소분류 추가">+ 소분류 추가</button>
            </div>
          </div>

          <div class="align-row">
            <div class="left-group">
              <label class="field">구매처
                <input id="seller" type="text" placeholder="예: ABC몰" />
              </label>
              <label class="field">재구매 의사
                <select id="repurchase">
                  <option value="">선택</option>
                  <option value="yes">예</option>
                  <option value="maybe">고민</option>
                  <option value="no">아니오</option>
                </select>
              </label>
            </div>

            <div class="right-group">
              <div class="right-inner">
                <label class="field">구매일
                  <input id="purchaseDate" type="date" />
                </label>
                <label class="field">가격(원)
                  <input id="price" type="number" min="0" step="1" placeholder="예: 12000" />
                </label>
                <label class="field">평점
                  <select id="rating">
                    <option value="">평점</option>
                    <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
                  </select>
                </label>
              </div>
            </div>
          </div>

          <div class="c-12">
            <label class="field">메모 <span class="note">(사용감, 유효기간, 주의사항 등)</span>
              <textarea id="notes" placeholder="예: 부드럽고 흡수 빠름"></textarea>
            </label>
          </div>

          <div class="c-6">
            <label class="field">이미지 (선택)
              <input id="image" type="file" accept="image/*" />
            </label>
          </div>

          <div class="c-6">
            <div style="display:flex;flex-direction:column;gap:8px">
              <div class="muted">빠른 검색</div>
              <input id="search" placeholder="제품명 / 구매처 / 메모 검색" />
            </div>
          </div>

          <div class="c-12 form-actions">
            <div style="margin-right:auto" class="muted">데이터는 클라우드에 자동 동기화됩니다 🔄</div>
            <button id="reset" type="button" class="ghost small">초기화</button>
            <button id="save" class="small">추가 / 저장</button>
          </div>
        </div>
      </form>

      <div class="filters" id="filterBar" role="region" aria-label="분류 필터">
        <div class="label">필터</div>
        <select id="filterMajor"><option value="">모든 대분류</option></select>
        <select id="filterMiddle"><option value="">모든 중분류</option></select>
        <select id="filterMinor"><option value="">모든 소분류</option></select>
        <div class="spacer"></div>
        <button id="clearFilter" class="ghost small" title="필터 초기화">필터 초기화</button>
      </div>

      <div style="margin-top:8px">
        <table id="productTable" aria-label="제품 목록">
          <thead>
            <tr>
              <th data-key="name">제품명</th>
              <th>분류</th>
              <th data-key="purchaseDate">구매일</th>
              <th data-key="price">가격</th>
              <th data-key="rating">평점</th>
              <th data-key="seller">구매처</th>
              <th>재구매</th>
              <th>이미지</th>
              <th>작업</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <aside class="side-panel">
      <div class="panel-block">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <strong>클라우드 동기화</strong>
          <button id="syncNow" class="ghost small">수동 동기화</button>
        </div>
        <div style="margin-top:8px;font-size:13px;color:var(--muted)">
          마지막 동기화: <span id="lastSyncTime">없음</span><br/>
          <span id="syncInfo" style="color:#166534;font-weight:500"></span>
        </div>
      </div>

      <div class="panel-block">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <strong>요약</strong>
        </div>
        <div style="margin-top:8px;font-size:13px;color:var(--muted)">
          항목 수: <span id="count">0</span><br/>
          카테고리 수: <span id="catCount">0</span>
        </div>
      </div>

      <div class="panel-block">
        <strong>분류 빠른 작업</strong>
        <div style="margin-top:8px;display:flex;gap:8px">
          <input id="quickMajor" placeholder="새 대분류" style="flex:1;padding:8px;border-radius:8px;border:1px solid #e6e9f0" />
          <button id="quickAddMajor" class="small">추가</button>
        </div>
        <div style="margin-top:10px">
          <button id="openCategoryMgr2" class="ghost small" style="width:100%">분류 관리 열기</button>
        </div>
      </div>

      <div class="panel-block">
        <strong>도움말</strong>
        <div style="margin-top:8px;font-size:13px;color:var(--muted)">
          • 컴퓨터와 모바일에서 같은 데이터를 실시간으로 공유합니다.<br/>
          • 필터와 검색을 함께 사용하면 원하는 항목만 빠르게 골라볼 수 있습니다.
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <strong>분류 관리</strong>
      <div style="margin-left:auto">
        <button id="closeModal" class="ghost small">닫기</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="mgrQuickMajor" placeholder="대분류 추가(빠른)" style="flex:1;padding:8px;border-radius:8px;border:1px solid #e6e9f0" />
      <button id="mgrQuickAddMajor" class="small">추가</button>
    </div>

    <div class="mgr-list" id="mgrList" aria-live="polite"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const CLOUD_PRODUCTS_KEY = 'products_cloud_v1';
  const CLOUD_CATEGORY_KEY = 'categories_cloud_v1';
  
  let products = [];
  let categoryTree = [];
  let isSyncing = false;

  // Sync status UI
  const syncStatus = document.getElementById('syncStatus');
  const syncStatusText = document.getElementById('syncStatusText');
  const lastSyncTime = document.getElementById('lastSyncTime');
  const syncInfo = document.getElementById('syncInfo');

  function showSyncStatus(status, message) {
    if (!syncStatus || !syncStatusText) return;
    syncStatus.style.display = 'inline-flex';
    syncStatus.className = 'sync-status';
    if (status === 'syncing') syncStatus.classList.add('syncing');
    else if (status === 'error') syncStatus.classList.add('error');
    syncStatusText.textContent = message;
    if (lastSyncTime && status === 'success') {
      lastSyncTime.textContent = new Date().toLocaleTimeString('ko-KR');
    }
    if (status !== 'syncing') {
      setTimeout(() => { if (syncStatus) syncStatus.style.display = 'none'; }, 3000);
    }
  }

  // Cloud sync functions
  async function loadFromCloud() {
    try {
      showSyncStatus('syncing', '클라우드에서 불러오는 중...');
      
      const [productsResult, categoriesResult] = await Promise.all([
        window.storage.get(CLOUD_PRODUCTS_KEY, true).catch(() => null),
        window.storage.get(CLOUD_CATEGORY_KEY, true).catch(() => null)
      ]);

      if (productsResult && productsResult.value) {
        products = JSON.parse(productsResult.value);
      }
      
      if (categoriesResult && categoriesResult.value) {
        categoryTree = JSON.parse(categoriesResult.value);
      }

      if (!categoryTree.length) {
        ensureCategoryDefaults();
      }

      showSyncStatus('success', '동기화 완료');
      if (syncInfo) syncInfo.textContent = '✓ 모든 기기에서 동일한 데이터 사용 중';
      return true;
    } catch (error) {
      console.error('Cloud load error:', error);
      showSyncStatus('error', '불러오기 실패');
      ensureCategoryDefaults();
      return false;
    }
  }

  async function saveToCloud() {
    if (isSyncing) return;
    isSyncing = true;
    
    try {
      showSyncStatus('syncing', '클라우드에 저장 중...');
      
      await Promise.all([
        window.storage.set(CLOUD_PRODUCTS_KEY, JSON.stringify(products), true),
        window.storage.set(CLOUD_CATEGORY_KEY, JSON.stringify(categoryTree), true)
      ]);

      showSyncStatus('success', '동기화 완료');
      if (syncInfo) syncInfo.textContent = '✓ 모든 기기에서 동일한 데이터 사용 중';
    } catch (error) {
      console.error('Cloud save error:', error);
      showSyncStatus('error', '저장 실패 - 다시 시도해주세요');
    } finally {
      isSyncing = false;
    }
  }

  function saveProducts() { 
    updateSummary(); 
    saveToCloud();
  }
  
  function saveCategoryTree() { 
    updateSummary(); 
    populateFilterSelects(); 
    populateMajorSelects(); 
    renderCategoryManager(); 
    saveToCloud();
  }

  // DOM refs
  const nameEl = document.getElementById('name');
  const majorEl = document.getElementById('majorSelect');
  const middleEl = document.getElementById('middleSelect');
  const minorEl = document.getElementById('minorSelect');
  const purchaseDateEl = document.getElementById('purchaseDate');
  const priceEl = document.getElementById('price');
  const ratingEl = document.getElementById('rating');
  const sellerEl = document.getElementById('seller');
  const repurchaseEl = document.getElementById('repurchase');
  const notesEl = document.getElementById('notes');
  const imageEl = document.getElementById('image');
  const saveBtn = document.getElementById('save');
  const resetBtn = document.getElementById('reset');
  const productTableBody = document.querySelector('#productTable tbody');
  const countEl = document.getElementById('count');
  const catCountEl = document.getElementById('catCount');
  const searchEl = document.getElementById('search');
  const quickMajor = document.getElementById('quickMajor');
  const quickAddMajor = document.getElementById('quickAddMajor');
  const addMajorBtn = document.getElementById('addMajor');
  const addMiddleBtn = document.getElementById('addMiddle');
  const addMinorBtn = document.getElementById('addMinor');
  const filterMajor = document.getElementById('filterMajor');
  const filterMiddle = document.getElementById('filterMiddle');
  const filterMinor = document.getElementById('filterMinor');
  const clearFilterBtn = document.getElementById('clearFilter');
  const openCategoryMgr = document.getElementById('openCategoryMgr');
  const openCategoryMgr2 = document.getElementById('openCategoryMgr2');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const mgrList = document.getElementById('mgrList');
  const closeModal = document.getElementById('closeModal');
  const mgrQuickMajor = document.getElementById('mgrQuickMajor');
  const mgrQuickAddMajor = document.getElementById('mgrQuickAddMajor');
  const exportCSVBtn = document.getElementById('exportCSV');
  const exportJSONBtn = document.getElementById('exportJSON');
  const btnImport = document.getElementById('btnImport');
  const clearAllBtn = document.getElementById('clearAll');
  const syncNowBtn = document.getElementById('syncNow');

  function uid(){ return 'p_' + Date.now() + '_' + Math.floor(Math.random()*10000); }
  function nowISO(){ return new Date().toISOString(); }
  function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function ensureCategoryDefaults(){
    if(!categoryTree.length){
      categoryTree = [
        {name:'스킨케어', children:[ {name:'클렌징', children:['오일','폼','워터']}, {name:'토너/미스트', children:['토너','미스트']} ]},
        {name:'메이크업', children:[ {name:'베이스', children:['프라이머','쿠션']}, {name:'색조', children:['립','섀도우']} ]},
      ];
    }
  }

  function populateMajorSelects(){
    const prevMajor = majorEl.value;
    const majors = categoryTree.map(c => c.name);
    majorEl.innerHTML = `<option value="">— 선택 —</option>` + majors.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    if (prevMajor && Array.from(majorEl.options).some(o => o.value === prevMajor)) majorEl.value = prevMajor; else majorEl.value = '';
    updateMiddleOptions();
  }

  function updateMiddleOptions(){
    const prevMiddle = middleEl.value;
    const selMajor = majorEl.value;
    const mj = categoryTree.find(c=>c.name===selMajor);
    const mids = mj ? mj.children.map(x=>x.name) : [];
    middleEl.innerHTML = '<option value="">— 선택 —</option>' + mids.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
    if (prevMiddle && Array.from(middleEl.options).some(o=>o.value===prevMiddle)) middleEl.value = prevMiddle; else middleEl.value = '';
    updateMinorOptions();
  }

  function updateMinorOptions(){
    const prevMinor = minorEl.value;
    const selMajor = majorEl.value;
    const selMid = middleEl.value;
    let minors = [];
    if(selMajor){
      const mj = categoryTree.find(c=>c.name===selMajor);
      if(mj){
        const md = mj.children.find(x=>x.name===selMid);
        if(md) minors = md.children.slice();
      }
    } else {
      const set = new Set();
      categoryTree.forEach(mj => mj.children.forEach(md => md.children.forEach(mn => set.add(mn))));
      minors = Array.from(set).sort();
    }
    minorEl.innerHTML = '<option value="">— 선택 —</option>' + minors.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
    if (prevMinor && Array.from(minorEl.options).some(o=>o.value===prevMinor)) minorEl.value = prevMinor; else minorEl.value = '';
  }

  function populateFilterSelects(){
    const prevMaj = (filterMajor && filterMajor.value) || '';
    const prevMid = (filterMiddle && filterMiddle.value) || '';
    const prevMin = (filterMinor && filterMinor.value) || '';

    const majors = categoryTree.map(c=>c.name);
    if(filterMajor) filterMajor.innerHTML = `<option value="">모든 대분류</option>` + majors.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');

    if(filterMajor){
      if(prevMaj && Array.from(filterMajor.options).some(o=>o.value===prevMaj)) filterMajor.value = prevMaj; else filterMajor.value = '';
    }

    if(filterMiddle) updateFilterMiddleOptions();

    if(filterMiddle){
      if(prevMid && Array.from(filterMiddle.options).some(o=>o.value===prevMid)) filterMiddle.value = prevMid; else filterMiddle.value = '';
    }
    if(filterMinor) updateFilterMinorOptions();
    if(filterMinor){
      if(prevMin && Array.from(filterMinor.options).some(o=>o.value===prevMin)) filterMinor.value = prevMin; else filterMinor.value = '';
    }
  }

  function updateFilterMiddleOptions(){
    if(!filterMajor || !filterMiddle) return;
    const selMaj = filterMajor.value;
    const mj = categoryTree.find(c=>c.name===selMaj);
    const mids = mj ? mj.children.map(x=>x.name) : [];
    filterMiddle.innerHTML = `<option value="">모든 중분류</option>` + mids.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
    filterMiddle.value = '';

  function findAffectedProducts(level, major, middle, minor){
    return products.filter(p => { if(!p.category) return false; if(level === 'major') return p.category.major === major; if(level === 'middle') return p.category.major === major && p.category.middle === middle; if(level === 'minor') return p.category.major === major && p.category.middle === middle && p.category.minor === minor; return false; });
  }

  function promptForReassignTarget(level){
    if(level === 'major'){ const target = prompt('재할당할 대분류 이름을 입력하세요') || ''; return target.trim() || null; }
    else if(level === 'middle'){ const tmaj = prompt('재할당할 대상의 대분류 이름을 입력하세요') || ''; if(!tmaj.trim()) return null; const tmid = prompt('대분류 "'+tmaj+'"의 중분류 이름을 입력하세요') || ''; if(!tmid.trim()) return null; return {major: tmaj.trim(), middle: tmid.trim()}; }
    else if(level === 'minor'){ const tmaj = prompt('재할당할 대상의 대분류 이름을 입력하세요') || ''; if(!tmaj.trim()) return null; const tmid = prompt('재할당할 대상의 중분류 이름을 입력하세요') || ''; if(!tmid.trim()) return null; const tmin = prompt('재할당할 대상의 소분류 이름을 입력하세요') || ''; if(!tmin.trim()) return null; return {major: tmaj.trim(), middle: tmid.trim(), minor: tmin.trim()}; }
    return null;
  }

  function handleDeleteMajor(majorName, mi){
    const affected = findAffectedProducts('major', majorName);
    if(affected.length){
      const choice = prompt(`대분류 "${majorName}"을(를) 사용하는 제품이 ${affected.length}건 있습니다.\n옵션: 1 = 재할당, 2 = 분류 제거(제품의 대/중/소를 비움), 아무키 = 취소`);
      if(choice === '1'){ const target = promptForReassignTarget('major'); if(!target) return alert('취소'); const tgt = categoryTree.find(c=>c.name===target); if(!tgt) return alert('지정한 대상 대분류가 존재하지 않습니다.'); affected.forEach(p => { p.category.major = target; p._localUpdated = nowISO(); }); }
      else if(choice === '2'){ affected.forEach(p => { p.category = {major:'', middle:'', minor:''}; p._localUpdated = nowISO(); }); }
      else return;
    }
    categoryTree.splice(mi,1);
    saveCategoryTree(); saveProducts(); populateMajorSelects(); render(); renderCategoryManager(); alert('삭제 완료');
  }

  if(filterMiddle) filterMiddle.addEventListener('change', ()=>{ updateFilterMinorOptions(); render(); });
  if(filterMinor) filterMinor.addEventListener('change', ()=> render());
  if(clearFilterBtn) clearFilterBtn.addEventListener('click', ()=>{ if(filterMajor) filterMajor.value = ''; if(filterMajor) updateFilterMiddleOptions(); if(filterMiddle) filterMiddle.value = ''; if(filterMiddle) updateFilterMinorOptions(); if(filterMinor) filterMinor.value = ''; render(); });

  if(searchEl) searchEl.addEventListener('input', render);

  // Initialize
  await loadFromCloud();
  populateMajorSelects();
  populateFilterSelects();
  render();
  updateSummary();
  if(majorEl) majorEl.addEventListener('change', updateMiddleOptions);
  if(middleEl) middleEl.addEventListener('change', updateMinorOptions);

}); 
</script>

<input id="importJSON" type="file" accept="application/json" style="display:none" />
</body>
