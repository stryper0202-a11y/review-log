<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화장품 기록장</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    input, select, button { display: block; margin: 10px 0; padding: 8px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f4f4f4; }
</style>
</head>
<body>

<h2>화장품 기록장</h2>

<form id="productForm">
    <input type="text" id="name" placeholder="제품명" required>
    <input type="text" id="category" placeholder="제품 분류" required>
    <input type="date" id="purchaseDate" placeholder="구매일" required>
    <input type="number" id="price" placeholder="가격" required>
    <input type="number" id="rating" placeholder="평점(1~5)" min="1" max="5" required>
    <input type="text" id="store" placeholder="구매처">
    <select id="repurchase">
        <option value="">재구매 의사</option>
        <option value="예">예</option>
        <option value="아니오">아니오</option>
    </select>
    <button type="submit">저장</button>
</form>

<table>
    <thead>
        <tr>
            <th>제품명</th>
            <th>분류</th>
            <th>구매일</th>
            <th>가격</th>
            <th>평점</th>
            <th>구매처</th>
            <th>재구매</th>
        </tr>
    </thead>
    <tbody id="productTable">
    </tbody>
</table>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
// Firebase 설정
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

// 익명 로그인
auth.signInAnonymously()
.then(() => console.log("로그인 성공"))
.catch(err => console.error("로그인 실패", err));

// 데이터 저장
document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = auth.currentUser;
    if (!user) return alert("로그인 필요");

    const data = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        purchaseDate: document.getElementById('purchaseDate').value,
        price: Number(document.getElementById('price').value),
        rating: Number(document.getElementById('rating').value),
        store: document.getElementById('store').value,
        repurchase: document.getElementById('repurchase').value,
        uid: user.uid,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('products').add(data);

    // 입력 필드 초기화
    document.getElementById('productForm').reset();
});

// 실시간 테이블 표시
auth.onAuthStateChanged(user => {
    if (!user) return;

    db.collection('products')
      .where('uid', '==', user.uid)
      .orderBy('timestamp', 'desc')
      .onSnapshot(snapshot => {
          const table = document.getElementById('productTable');
          table.innerHTML = '';
          snapshot.forEach(doc => {
              const p = doc.data();
              const row = `<tr>
                <td>${p.name}</td>
                <td>${p.category}</td>
                <td>${p.purchaseDate}</td>
                <td>${p.price}</td>
                <td>${p.rating}</td>
                <td>${p.store}</td>
                <td>${p.repurchase}</td>
              </tr>`;
              table.innerHTML += row;
          });
      });
});
</script>

</body>
</html>
