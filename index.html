<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화장품 기록장</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore-compat.js"></script>

<style>
body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; }
input, select { margin-bottom: 5px; display: block; width: 100%; padding: 5px; }
button { margin-top: 10px; padding: 5px 10px; }
#records { margin-top: 20px; }
.record { border-bottom: 1px solid #ccc; padding: 5px 0; }
</style>
</head>
<body>
<h1>화장품 기록장</h1>

<!-- 기존 입력 폼 -->
<input type="text" id="name" placeholder="제품명">
<select id="category">
  <option value="스킨케어">스킨케어</option>
  <option value="메이크업">메이크업</option>
  <option value="헤어">헤어</option>
</select>
<input type="date" id="purchaseDate">
<input type="number" id="price" placeholder="가격">
<select id="rating">
  <option value="1">★☆☆☆☆</option>
  <option value="2">★★☆☆☆</option>
  <option value="3">★★★☆☆</option>
  <option value="4">★★★★☆</option>
  <option value="5">★★★★★</option>
</select>
<input type="text" id="store" placeholder="구매처">
<select id="repurchase">
  <option value="예">예</option>
  <option value="아니오">아니오</option>
</select>

<button onclick="addRecord()">저장</button>

<div id="records"></div>

<script>
  // 🔹 Firebase 초기화
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // 🔹 기록 저장 + 기존 기능 유지
  function addRecord() {
    const record = {
      name: document.getElementById('name').value,
      category: document.getElementById('category').value,
      purchaseDate: document.getElementById('purchaseDate').value,
      price: parseInt(document.getElementById('price').value),
      rating: parseInt(document.getElementById('rating').value),
      store: document.getElementById('store').value,
      repurchase: document.getElementById('repurchase').value,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    // Firebase에 저장
    db.collection('cosmetics').add(record)
      .then(() => {
        alert("저장되었습니다!");
        clearInputs();
        loadRecords(); // 저장 후 기록 업데이트
      })
      .catch(error => console.error("저장 오류:", error));
  }

  // 입력 필드 초기화 (기존 기능 유지)
  function clearInputs() {
    document.getElementById('name').value = '';
    document.getElementById('category').value = '스킨케어';
    document.getElementById('purchaseDate').value = '';
    document.getElementById('price').value = '';
    document.getElementById('rating').value = '1';
    document.getElementById('store').value = '';
    document.getElementById('repurchase').value = '예';
  }

  // 🔹 기록 불러오기 (Firebase + 기존 화면 표시)
  function loadRecords() {
    const container = document.getElementById('records');
    container.innerHTML = '';

    db.collection('cosmetics').orderBy('timestamp', 'desc').get()
      .then(snapshot => {
        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement('div');
          div.className = 'record';
          div.innerHTML = `
            <strong>${data.name}</strong> (${data.category})<br>
            구매일: ${data.purchaseDate}, 가격: ${data.price}원, 평점: ${data.rating}★<br>
            구매처: ${data.store}, 재구매 의사: ${data.repurchase}
          `;
          container.appendChild(div);
        });
      });
  }

  // 페이지 로드 시 기록 표시
  loadRecords();
</script>
</body>
</html>
