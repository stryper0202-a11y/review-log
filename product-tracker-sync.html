<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>구매 제품 기록장 — 기기 간 동기화</title>

<style>
  /* [CSS는 원본과 동일하게 유지] */
  :root{--blue:#2563eb;--muted:#6b7280;--gap:12px;--radius:10px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",Arial;}
  *{box-sizing:border-box}
  body{margin:0;background:#f3f5fb;padding:20px;color:#111;}
  .wrap{max-width:1100px;margin:0 auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 30px rgba(8,15,40,0.06);} 
  header{display:flex;align-items:center;gap:12px;margin-bottom:12px;} h1{font-size:18px;margin:0}
  .toolbar{margin-left:auto;display:flex;gap:8px;align-items:center;} button{background:var(--blue);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer} button.ghost{background:#f3f4f6;color:#111;border:1px solid #e6e9f0} button.small{padding:6px 8px;font-size:13px}
  .form-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;}
  /* [.... CSS 생략 ....] */
  .sync-indicator{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  /* [.... CSS 생략 ....] */
  /* [로그인 UI 스타일 추가] */
  #loginContainer { padding: 40px 20px; text-align: center; background: #fbfdff; border-radius: 10px; }
  #mainContent { display: none; } /* 처음에는 메인 콘텐츠 숨기기 */
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>구매 제품 기록장</h1>
    <div class="toolbar">
      <button id="authBtn" class="small">Google 로그인</button>
      <span id="syncStatus" class="sync-status" style="display:none">
        <span class="sync-indicator"></span>
        <span id="syncStatusText">동기화 완료</span>
      </span>
      <button id="openCategoryMgr" class="ghost small">분류 관리</button>
      <button id="exportCSV" class="ghost small">CSV</button>
      <button id="exportJSON" class="ghost small">JSON</button>
      <button id="btnImport" class="ghost small">불러오기</button>
      <button id="clearAll" class="ghost small">모두 삭제</button>
    </div>
  </header>

  <div id="loginContainer">
    <h2>데이터를 동기화하려면 로그인이 필요합니다.</h2>
    <p>Google 계정으로 로그인하여 여러 기기에서 데이터를 안전하게 동기화하세요.</p>
    <button id="loginButton">Google 계정으로 시작하기</button>
  </div>

  <div id="mainContent">
    <div class="form-grid">
        <div>
          <form id="productForm" onsubmit="return false;">
                  </form>
    
          <div class="filters" id="filterBar" role="region" aria-label="분류 필터">
                  </div>
    
          <div style="margin-top:8px">
            <table id="productTable" aria-label="제품 목록">
                      </table>
          </div>
        </div>
    
        <aside class="side-panel">
              </aside>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  </div>

<script type="module">
// [중요] 스크립트 시작을 DOMContentLoaded 대신 Firebase Auth 상태 변경으로 변경
document.addEventListener('DOMContentLoaded', () => {
  // HTML 상단에서 초기화된 Firebase 객체들을 가져옵니다.
  const { auth, db, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, doc, getDoc, setDoc } = window.fb;

  let products = [];
  let categoryTree = [];
  let isSyncing = false;
  let currentUser = null; // [추가] 현재 유저 정보
  let userDocRef = null;  // [추가] 유저 데이터 경로 참조

  // Sync status UI
  const syncStatus = document.getElementById('syncStatus');
  const syncStatusText = document.getElementById('syncStatusText');
  const lastSyncTime = document.getElementById('lastSyncTime');
  const syncInfo = document.getElementById('syncInfo');
  
  // [추가] UI 요소 참조
  const loginContainer = document.getElementById('loginContainer');
  const mainContent = document.getElementById('mainContent');
  const authBtn = document.getElementById('authBtn');
  const loginButton = document.getElementById('loginButton');

  function showSyncStatus(status, message) {
    // [... 원본과 동일 ...]
    if (!syncStatus || !syncStatusText) return;
    syncStatus.style.display = 'inline-flex';
    syncStatus.className = 'sync-status';
    if (status === 'syncing') syncStatus.classList.add('syncing');
    else if (status === 'error') syncStatus.classList.add('error');
    syncStatusText.textContent = message;
    if (lastSyncTime && status === 'success') {
      lastSyncTime.textContent = new Date().toLocaleTimeString('ko-KR');
    }
    if (status !== 'syncing') {
      setTimeout(() => { if (syncStatus) syncStatus.style.display = 'none'; }, 3000);
    }
  }

  // ### [수정됨] Cloud sync functions ###
  async function loadFromCloud() {
    // [수정] 로그인한 유저의 고유 문서(Doc) 참조가 있어야 함
    if (!userDocRef) {
      console.log('User not logged in, cannot load from cloud.');
      ensureCategoryDefaults();
      initializeAppUI(); // UI 초기화만 진행
      return false;
    }

    try {
      showSyncStatus('syncing', '클라우드에서 불러오는 중...');
      
      // [수정] Firestore에서 'user-data/{userId}' 문서를 가져옴
      const docSnap = await getDoc(userDocRef);

      if (docSnap.exists()) {
        const data = docSnap.data();
        products = JSON.parse(data.products || '[]');
        categoryTree = JSON.parse(data.categories || '[]');
      } else {
        // 유저가 처음 사용하는 경우 (문서 없음)
        console.log('No such document! Initializing defaults.');
        products = [];
        categoryTree = [];
      }

      if (!categoryTree.length) {
        ensureCategoryDefaults();
      }

      showSyncStatus('success', '동기화 완료');
      if (syncInfo) syncInfo.textContent = '✓ 모든 기기에서 동일한 데이터 사용 중';
      
      initializeAppUI(); // [중요] 데이터 로드 후 UI 초기화
      return true;
    } catch (error) {
      console.error('Cloud load error:', error);
      showSyncStatus('error', '불러오기 실패');
      ensureCategoryDefaults();
      initializeAppUI(); // 에러가 나도 UI는 초기화
      return false;
    }
  }

  async function saveToCloud() {
    // [수정] 로그인한 유저의 참조가 없으면 저장 안 함
    if (!userDocRef) {
      console.log('User not logged in, cannot save to cloud.');
      return;
    }
    if (isSyncing) return;
    isSyncing = true;
    
    try {
      showSyncStatus('syncing', '클라우드에 저장 중...');
      
      // [수정] Firestore의 'user-data/{userId}' 문서에 두 데이터를 모두 저장
      await setDoc(userDocRef, {
        products: JSON.stringify(products),
        categories: JSON.stringify(categoryTree)
      });

      showSyncStatus('success', '동기화 완료');
      if (syncInfo) syncInfo.textContent = '✓ 모든 기기에서 동일한 데이터 사용 중';
    } catch (error) {
      console.error('Cloud save error:', error);
      showSyncStatus('error', '저장 실패 - 다시 시도해주세요');
    } finally {
      isSyncing = false;
    }
  }
  // ### [수정 완료] Cloud sync functions ###

  function saveProducts() { 
    updateSummary(); 
    saveToCloud(); // 이 함수가 이제 Firebase에 저장합니다.
  }
  
  function saveCategoryTree() { 
    updateSummary(); 
    populateFilterSelects(); 
    populateMajorSelects(); 
    renderCategoryManager(); 
    saveToCloud(); // 이 함수가 이제 Firebase에 저장합니다.
  }

  // ### [추가] 인증 관련 로직 ###
  const provider = new GoogleAuthProvider();

  // 구글 로그인 팝업
  async function signIn() {
    try {
      await signInWithPopup(auth, provider);
      // onAuthStateChanged가 나머지를 처리합니다.
    } catch (error) {
      console.error('Sign-in error:', error);
      alert('로그인에 실패했습니다: ' + error.message);
    }
  }

  // 로그아웃
  async function doSignOut() {
    try {
      await signOut(auth);
      // onAuthStateChanged가 나머지를 처리합니다.
    } catch (error) {
      console.error('Sign-out error:', error);
    }
  }
  
  // 로그인 버튼 이벤트
  loginButton.addEventListener('click', signIn);
  authBtn.addEventListener('click', () => {
    if (currentUser) {
      doSignOut();
    } else {
      signIn();
    }
  });

  // [중요] 인증 상태 리스너 (앱의 시작점)
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // --- 사용자가 로그인한 경우 ---
      currentUser = user;
      // [수정] 사용자의 고유한 데이터 문서 경로 설정
      userDocRef = doc(db, 'user-data', user.uid); 
      
      loginContainer.style.display = 'none';
      mainContent.style.display = 'block';
      authBtn.textContent = '로그아웃';
      authBtn.title = user.displayName || user.email;

      // [수정] 로그인 성공 후 클라우드에서 데이터 로드
      loadFromCloud();

    } else {
      // --- 사용자가 로그아웃한 경우 ---
      currentUser = null;
      userDocRef = null;
      products = [];
      categoryTree = [];

      loginContainer.style.display = 'block';
      mainContent.style.display = 'none';
      authBtn.textContent = 'Google 로그인';
      authBtn.title = '';
      
      // 테이블 및 폼 비우기
      if (productTableBody) productTableBody.innerHTML = '';
      updateSummary();
    }
  });


  // DOM refs
  const nameEl = document.getElementById('name');
  // [.... DOM refs 생략 ....]
  const syncNowBtn = document.getElementById('syncNow');
  const productTableBody = document.querySelector('#productTable tbody');

  // [.... uid, nowISO, esc 함수 생략 (원본과 동일) ....]
  
  function uid(){ return 'p_' + Date.now() + '_' + Math.floor(Math.random()*10000); }
  function nowISO(){ return new Date().toISOString(); }
  function esc(s){ return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }


  // [.... ensureCategoryDefaults 함수 생략 (원본과 동일) ....]
  function ensureCategoryDefaults(){
    if(!categoryTree.length){
      categoryTree = [
        {name:'스킨케어', children:[ {name:'클렌징', children:['오일','폼','워터']}, {name:'토너/미스트', children:['토너','미스트']} ]},
        {name:'메이크업', children:[ {name:'베이스', children:['프라이머','쿠션']}, {name:'색조', children:['립','섀도우']} ]},
      ];
    }
  }

  // ------------------------------------------------------------------
  // [중요] 앱의 모든 UI 초기화 로직을 이 함수로 감쌉니다.
  // ------------------------------------------------------------------
  function initializeAppUI() {
    
    // [.... 원본 코드의 나머지 부분(함수, 이벤트 리스너)이 모두 이 안에 들어갑니다 ....]
    
    // [.... populateMajorSelects 함수 생략 (원본과 동일) ....]
    // [.... updateMiddleOptions 함수 생략 (원본과 동일) ....]
    // [.... updateMinorOptions 함수 생략 (원본과 동일) ....]
    // [.... populateFilterSelects 함수 생략 (원본과 동일) ....]
    // [.... updateFilterMiddleOptions 함수 생략 (원본과 동일) ....]
    // [.... updateFilterMinorOptions 함수 생략 (원본과 동일) ....]
    // [.... addMajorBtn 리스너 생략 (원본과 동일) ....]
    // [.... addMiddleBtn 리스너 생략 (원본과 동일) ....]
    // [.... addMinorBtn 리스너 생략 (원본과 동일) ....]
    // [.... quickAddMajor 리스너 생략 (원본과 동일) ....]
    // [.... 모달 관련 리스너 생략 (원본과 동일) ....]
    // [.... mgrQuickAddMajor 리스너 생략 (원본과 동일) ....]
    // [.... renderCategoryManager 함수 생략 (원본과 동일) ....]
    // [.... findAffectedProducts 함수 생략 (원본과 동일) ....]
    // [.... promptForReassignTarget 함수 생략 (원본과 동일) ....]
    // [.... handleDeleteMajor 함수 생략 (원본과 동일) ....]
    // [.... handleDeleteMiddle 함수 생략 (원본과 동일) ....]
    // [.... handleDeleteMinor 함수 생략 (원본과 동일) ....]

    // (설명을 위해 원본 코드의 일부 함수만 남겨둡니다. 실제로는 모두 복사해야 합니다.)

    function populateMajorSelects(){
    const prevMajor = majorEl.value;
    const majors = categoryTree.map(c => c.name);
    majorEl.innerHTML = `<option value="">— 선택 —</option>` + majors.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    if (prevMajor && Array.from(majorEl.options).some(o => o.value === prevMajor)) majorEl.value = prevMajor; else majorEl.value = '';
    updateMiddleOptions();
    }
    
    function updateMiddleOptions(){
    const prevMiddle = middleEl.value;
    const selMajor = majorEl.value;
    const mj = categoryTree.find(c=>c.name===selMajor);
    const mids = mj ? mj.children.map(x=>x.name) : [];
    middleEl.innerHTML = '<option value="">— 선택 —</option>' + mids.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
    if (prevMiddle && Array.from(middleEl.options).some(o=>o.value===prevMiddle)) middleEl.value = prevMiddle; else middleEl.value = '';
    updateMinorOptions();
    }

    function updateMinorOptions(){
    const prevMinor = minorEl.value;
    const selMajor = majorEl.value;
    const selMid = middleEl.value;
    let minors = [];
    if(selMajor){
      const mj = categoryTree.find(c=>c.name===selMajor);
      if(mj){
        const md = mj.children.find(x=>x.name===selMid);
        if(md) minors = md.children.slice();
      }
    } else {
      const set = new Set();
      categoryTree.forEach(mj => mj.children.forEach(md => md.children.forEach(mn => set.add(mn))));
      minors = Array.from(set).sort();
    }
    minorEl.innerHTML = '<option value="">— 선택 —</option>' + minors.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
    if (prevMinor && Array.from(minorEl.options).some(o=>o.value===prevMinor)) minorEl.value = prevMinor; else minorEl.value = '';
    }

    // [.... 나머지 원본 함수 및 이벤트 리스너들 ....]
    // [.... (생략) ....]
    function render() {
        // [.... 원본 render 함수 ....]
        // 예: productTableBody.innerHTML = '...';
        // (이 함수는 생략하면 안 됩니다)
    }

    // [중요] UI 초기화의 마지막 단계
    populateMajorSelects();
    populateFilterSelects();
    render(); // 데이터로 테이블 렌더링
    updateSummary();

  } // [End of initializeAppUI function]
});
</script>

</body>
</html>
